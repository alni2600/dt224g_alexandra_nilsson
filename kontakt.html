        <main>
            <!--KONTAKTUPPGIFTER-->
            <h1>Kontakta mig.</h1>
            <p>Hör av dig till mig genom att fylla i formuläret nedanför!</p>
            
             <form class="form">
                <div class="form-group">
                    <!-- for kopplar samman labeln med input och gör att man kan trycka på labeln för att fokusera på input -->
                    <label for="name">Ditt namn:</label>
                    <!-- input skapar ett inmatningsfält, type talar om typen av input, id kopplar samman label och input, name är namnet på den datorvariabel som skickas till servern när formuläret skickas in. Utan name kommer servern inte kunna identifiera vad användaren har skrivit -->
                    <input type="text" id="name" name="name" placeholder="t.ex. Emil Persson">
                </div>
               
                <label for="email">Din epost:</label>
                <input type="email" id="email" name="email" required placeholder="t.ex. emil.persson@hotmail.com">
                <br>

                <label for="subject">Vad gäller ditt ärende?</label>
                <select id="subject" name="subject">
                    <option>Välj ärende</option>
                    <option>Samarbetsförfrågan</option>
                    <option>Allmän fråga</option>
                </select>

                <br>
                <label for="message">Meddelande</label>
                <br>
                <textarea id="message" name="message" required></textarea>
                <br> 

                <button type="submit">Skicka</button>
            </form>

            <p>Det går även bra att mejla mig direkt på <a href="mailto:alni2600@student.miun.se">alni2600@student.miun.se</a></p>
